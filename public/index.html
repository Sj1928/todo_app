<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App | Node.JS Express.JS SQLite</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/fanta.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        /* Navbar */
        #navbar {
            display: none;
            background: #1a1a1a;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #navbar .nickname {
            font-weight: bold;
        }

        #navbar .logout {
            cursor: pointer;
            font-size: 18px;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <div id="navbar">
        <span class="nickname" id="nickname">User</span>
        <span class="logout" onclick="logout()" title="Logout">
            <i class="fa-solid fa-right-from-bracket"></i>
        </span>
    </div>

    <!-- Auth -->
    <section id="auth">
        <div>
            <h2 className="sign-up-text">Login</h2>
            <p>Create an account!</p>
        </div>

        <p id="error" style="display: none;"></p>
        <input id="emailInput" placeholder="Email" />
        <input id="passwordInput" placeholder="********" type="password" />
        <button id="authBtn" onclick="authenticate()">
            Submit
        </button>
        <hr />
        <div class="register-content">
            <p>Don&apos;t have an account?</p>
            <button onclick="toggleIsRegister()" id="registerBtn">Sign up</button>
        </div>
    </section>

    <header style="display: none;">
        <h1 class="text-gradient">You have 0 open tasks.</h1>
    </header>
    <nav style="display: none;" class="tab-container">
    <button onclick="changeTab('All')" class="tab-button selected-tab">
        <h4>All <span></span></h4>
    </button>
    <button onclick="changeTab('Open')" class="tab-button">
        <h4>Open <span></span></h4>
    </button>
    <button onclick="changeTab('Complete')" class="tab-button">
        <h4>Completed <span></span></h4>
    </button>
    <hr />
</nav>

    <main style="display: none;"></main>
</body>

<script>
    let token = localStorage.getItem('token')
    let nickname = ''
    let isLoading = false
    let isAuthenticating = false
    let isRegistration = false
    let selectedTab = 'All'
    let todos = []

    const apiBase = '/'

    // elements
    const nav = document.querySelector('nav')
    const header = document.querySelector('header')
    const main = document.querySelector('main')
    const navElements = document.querySelectorAll('.tab-button')
    const authContent = document.getElementById('auth')
    const textError = document.getElementById('error')
    const email = document.getElementById('emailInput')
    const password = document.getElementById('passwordInput')
    const registerBtn = document.getElementById('registerBtn')
    const authBtn = document.getElementById('authBtn')
    const nicknameEl = document.getElementById('nickname')
    const navbar = document.getElementById('navbar')

    // PAGE RENDERING LOGIC
    async function showDashboard() {
        nav.style.display = 'block'
        header.style.display = 'flex'
        main.style.display = 'flex'
        authContent.style.display = 'none'
        navbar.style.display = 'flex'
        nicknameEl.innerText = nickname

        await fetchTodos()
    }

    function updateHeaderText() {
        const todosLength = todos.length
        const newString = todos.length === 1 ?
            `You have 1 open task.` :
            `You have ${todosLength} open tasks.`
        header.querySelector('h1').innerText = newString
    }

    function updateNavCount() {
    navElements.forEach(ele => {
        // get tab name from h4 text
        const btnText = ele.querySelector('h4').childNodes[0].textContent.trim()

        let count = 0
        if (btnText === 'All') {
            count = todos.length
        } else if (btnText === 'Open') {
            count = todos.filter(val => !Boolean(val.completed)).length
        } else if (btnText === 'Completed') { // Changed from 'Complete' to 'Completed'
            count = todos.filter(val => Boolean(val.completed)).length
        }

        ele.querySelector('span').innerText = `(${count})`
    })
}



    function changeTab(tab) {
        selectedTab = tab
        navElements.forEach(val => {
            if (val.innerText.includes(tab)) {
                val.classList.add('selected-tab')
            } else {
                val.classList.remove('selected-tab')
            }
        })
        renderTodos()
    }

    function renderTodos() {
        updateNavCount()
        updateHeaderText()

        let todoList = ``
        todos.filter(val => {
            return selectedTab === 'All' ? true : selectedTab === 'Complete' ? val.completed : !val.completed
        }).forEach((todo) => {
            const taskIndex = todo.todoId // ✅ fixed here
            todoList += `
            <div class="card todo-item">
                <p>${todo.task}</p>
                <div class="todo-buttons">
                    <button onclick="updateTodo(${taskIndex})" ${todo.completed ? 'disabled' : ''}>
                        <h6>Done</h6>
                    </button>
                    <button onclick="deleteTodo(${taskIndex})">
                        <h6>Delete</h6>
                    </button>
                </div>
            </div>
            `
        })
        todoList += `
        <div class="input-container">
            <input id="todoInput" placeholder="Add task" />
            <button onclick="addTodo()">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>
        `
        main.innerHTML = todoList
    }

    // AUTH LOGIC
    async function toggleIsRegister() {
        isRegistration = !isRegistration
        registerBtn.innerText = isRegistration ? 'Sign in' : 'Sign up'
        document.querySelector('#auth > div h2').innerText = isRegistration ? 'Sign Up' : 'Login'
        document.querySelector('.register-content p').innerText = isRegistration ? 'Already have an account?' : 'Don\'t have an account?'
        document.querySelector('.register-content button').innerText = isRegistration ? 'Sign in' : 'Sign up'
    }

    async function authenticate() {
        const emailVal = email.value
        const passVal = password.value

        if (
            isLoading ||
            isAuthenticating ||
            !emailVal ||
            !passVal ||
            passVal.length < 6 ||
            !emailVal.includes('@')
        ) { return }

        error.style.display = 'none'
        isAuthenticating = true
        authBtn.innerText = 'Authenticating...'

        try {
            let data
            if (isRegistration) {
                const response = await fetch(apiBase + 'auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: emailVal, password: passVal })
                })
                data = await response.json()
            } else {
                const response = await fetch(apiBase + 'auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: emailVal, password: passVal })
                })
                data = await response.json()
            }

            if (data.token) {
                token = data.token
                nickname = emailVal.split('@')[0]
                localStorage.setItem('token', token)

                authBtn.innerText = 'Loading...'
                await fetchTodos()
                showDashboard()
            } else {
                throw Error('❌ Failed to authenticate...')
            }

        } catch (err) {
            console.log(err.message)
            error.innerText = err.message
            error.style.display = 'block'
        } finally {
            authBtn.innerText = 'Submit'
            isAuthenticating = false
        }
    }

    // 👇 Logout function
    function logout() {
        token = null
        nickname = ''
        localStorage.removeItem('token')
        todos = []

        navbar.style.display = 'none'
        nav.style.display = 'none'
        header.style.display = 'none'
        main.style.display = 'none'
        authContent.style.display = 'block'

        email.value = ''
        password.value = ''
    }

    // CRUD LOGIC
    async function fetchTodos() {
        isLoading = true
        const response = await fetch(apiBase + 'todos', {
            headers: { 'Authorization': token }
        })
        const todosData = await response.json()
        todos = todosData
        isLoading = false
        renderTodos()
    }

    async function updateTodo(todoId) { // ✅ fixed param
        const todo = todos.find(val => val.todoId === todoId)
        if (!todo) return

        await fetch(apiBase + 'todos/' + todoId, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': token
            },
            body: JSON.stringify({ task: todo.task, completed: 1 })
        })
        fetchTodos()
    }

    async function deleteTodo(todoId) { // ✅ fixed param
        await fetch(apiBase + 'todos/' + todoId, {
            method: 'DELETE',
            headers: { 'Authorization': token },
        })
        fetchTodos()
    }

    async function addTodo() {
        const todoInput = document.getElementById('todoInput')
        const task = todoInput.value
        if (!task) return

        await fetch(apiBase + 'todos', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': token
            },
            body: JSON.stringify({ task })
        })
        todoInput.value = ''
        fetchTodos()
    }

    // AUTO LOGIN
    if (token) {
        async function run() {
            nickname = email.value ? email.value.split('@')[0] : 'User'
            await fetchTodos()
            showDashboard()
        }
        run()
    }
</script>

</html>
